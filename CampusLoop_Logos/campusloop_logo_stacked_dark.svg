    <path d="M 70 140 A 70 70 0 1 1 140 210" fill="none" stroke="#D1FF4D" stroke-width="26" stroke-linecap="square" />
    <rect x="52" y="175" width="54" height="54" rx="3" fill="#D1FF4D" />
  </g>
  <!-- Typography Centered -->
