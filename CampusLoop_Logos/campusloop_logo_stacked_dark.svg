  <text x="400" y="585" class="brand-sub" fill="#D1FF4D">CAMPUS WASTE INTELLIGENCE</text>
  <text x="400" y="625" class="brand-sub" fill="#8B949E">AUTONOMOUS CIRCULAR OS</text>
