      .brand-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; font-size: 96px; letter-spacing: -2px; text-anchor: middle; }
      .brand-sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; letter-spacing: 0.3em; text-anchor: middle; }
    </style>
  </defs>
  <rect width="800" height="800" rx="48" fill="#090A0C" />
  <rect x="24" y="24" width="752" height="752" rx="36" fill="none" stroke="#22262B" stroke-width="3" />
  <!-- Center Icon -->
  <g transform="translate(260, 140)">
