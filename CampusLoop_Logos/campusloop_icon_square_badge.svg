<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <radialGradient id="voltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D1FF4D" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D1FF4D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15181E" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="512" height="512" rx="96" fill="#090A0C" />

  <!-- Ambient Volt Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#voltGlow)" />

  <!-- Main Instrument Panel Frame -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="url(#panelGrad)" stroke="#22262B" stroke-width="4" />

  <!-- Technical Corner Ticks -->
  <line x1="72" y1="56" x2="72" y2="76" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="56" y1="72" x2="76" y2="72" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="440" y1="56" x2="440" y2="76" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="436" y1="72" x2="456" y2="72" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="72" y1="436" x2="72" y2="456" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="56" y1="440" x2="76" y2="440" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="440" y1="436" x2="440" y2="456" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />
  <line x1="436" y1="440" x2="456" y2="440" stroke="#D1FF4D" stroke-width="2" opacity="0.6" />

  <!-- Inner Hairline Guide Box -->
  <rect x="88" y="88" width="336" height="336" rx="32" fill="none" stroke="#22262B" stroke-width="3" stroke-dasharray="8 8" opacity="0.8" />

  <!-- Tactical Status Indicator -->
  <circle cx="120" cy="120" r="6" fill="#00E676" />
  <text x="136" y="125" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="2">SYS / ONLINE</text>

  <!-- The CampusLoop Symbol (Center) -->
  <g transform="translate(256,260)">
    <path d="M -84 0 A 84 84 0 1 1 0 84" fill="none" stroke="#D1FF4D" stroke-width="32" stroke-linecap="square" filter="url(#neonGlow)" />
    <rect x="-106" y="42" width="64" height="64" rx="4" fill="#D1FF4D" filter="url(#neonGlow)" />
  </g>

  <!-- Sub-label in badge -->
  <text x="256" y="420" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="4">CAMPUSLOOP â€¢ OS 1.0</text>
</svg>
